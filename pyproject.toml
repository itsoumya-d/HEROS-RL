[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heros-rl"
version = "0.1.0"
description = "Critic-free GRPO policy engine for zero-downtime PostgreSQL migrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soumya Debnath" }]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.45",
  "trl>=0.12",
  "datasets>=2.20",
  "accelerate>=0.34",
  "peft>=0.13",
]
unsloth = [
  "unsloth>=2024.10",
  "trl>=0.12",
  "peft>=0.13",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["heros_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
